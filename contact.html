<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Mahasiswa S3 | Kontak</title>
    <!-- Tailwind CSS CDN untuk RWD -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- HEADER & NAVIGATION (Konsisten) -->
    <header class="bg-blue-600 shadow-lg sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-white">
                Portofolio [Nama]
            </a>
            <!-- Navigasi Utama -->
            <nav class="space-x-4">
                <a href="index.html" class="text-blue-200 hover:text-white transition">Beranda</a>
                <a href="portfolio.html" class="text-blue-200 hover:text-white transition">Portofolio</a>
                <a href="contact.html" class="text-white font-semibold border-b-2 border-white pb-1">Kontak</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow py-12">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold text-center text-blue-700 mb-4">Form Permintaan Proyek</h1>
            <p class="text-center text-gray-600 mb-8 max-w-lg mx-auto">
                Silakan isi formulir di bawah ini untuk memulai proyek sederhana.
            </p>

            <!-- FORMULIR (Responsif dan Sederhana) -->
            <div class="max-w-md mx-auto bg-white p-6 md:p-8 rounded-xl shadow-2xl">
                <form action="#" method="POST" class="space-y-4">

                    <!-- Text Input: Nama -->
                    <div>
                        <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Anda</label>
                        <input type="text" id="nama" name="nama" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm"
                               placeholder="Nama Lengkap">
                    </div>

                    <!-- Text Input: Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" name="email" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm"
                               placeholder="email@contoh.com">
                    </div>

                    <!-- Select Dropdown: Jenis Layanan -->
                    <div>
                        <label for="layanan" class="block text-sm font-medium text-gray-700 mb-1">Jenis Layanan</label>
                        <select id="layanan" name="layanan" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm bg-white">
                            <option value="" disabled selected>Pilih jenis proyek...</option>
                            <option value="web-sederhana">Website Sederhana (HTML/CSS)</option>
                            <option value="konsultasi">Konsultasi Tugas/Dasar IT</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </div>

                    <!-- Textarea: Pesan/Deskripsi Proyek -->
                    <div>
                        <label for="deskripsi" class="block text-sm font-medium text-gray-700 mb-1">Pesan / Deskripsi Proyek</label>
                        <textarea id="deskripsi" name="deskripsi" rows="3" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm"
                                  placeholder="Jelaskan secara singkat kebutuhan Anda..."></textarea>
                    </div>

                    <!-- Checkbox: Persetujuan -->
                    <div class="pt-2">
                        <div class="flex items-center">
                            <input id="syarat" name="syarat" type="checkbox" required
                                   class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded">
                            <label for="syarat" class="ml-2 text-sm text-gray-700">Saya menyetujui kontak lebih lanjut.</label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button type="submit"
                                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-md text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-300">
                            Kirim Permintaan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER (Konsisten) -->
    <footer class="bg-gray-800 text-white mt-8 py-4">
        <div class="container mx-auto px-4 text-center">
            <p class="text-xs">&copy; 2024 Portofolio | Dibuat oleh Mahasiswa S3.</p>
            <p class="text-xs mt-1">
                Wajib mencantumkan link:
                <a href="https://itpln.ac.id" target="_blank" class="text-yellow-400 hover:text-yellow-200 font-medium transition">
                    https://itpln.ac.id
                </a>
            </p>
        </div>
    </footer>

</body>
</html>
